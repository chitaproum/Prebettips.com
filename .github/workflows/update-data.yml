name: Update football data and deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */8 * * *'
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'fetch_data.py'
      - 'api-config.json'
      - '.github/workflows/update-data.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: football-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch real data (key stays private)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python fetch_data.py
      - name: Preserve data and prediction snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js prediction-archive.json h2h-cache.json odds-cache.json api-request-cache.json league-discovery-cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh football data and saved predictions'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public website only
        run: |
          mkdir -p _site
          cp *.html styles.css theme.js app.js ads.js data.js _site/
          for folder in images assets; do
            if [ -d "$folder" ]; then cp -r "$folder" _site/; fi
          done
          # Include ads.txt if present
          if [ -f ads.txt ]; then cp ads.txt _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
